[env]
_.python.venv = { path = ".venv", create = true }
CDK_DOCKER = "finch"
AWS_REGION = "us-west-2"
CDK_DEFAULT_REGION = "{{env.AWS_REGION}}"
STACK_NAME = "moodle-plugins"
EVENT_BUS_NAME = "moodle-events"
# Must match "@aws-cdk/core:bootstrapQualifier" in cdk.json
QUALIFIER = "moodleplug"

[tools]
node = "22"
python = "3.13"
aws-cli = "latest"
uv = "0.13.7"
# Used by `mise run audit`. The Python scanners are in requirements-dev.txt
shellcheck = "0.11.0"


[tasks.init] 
description = "Install project dependencies"
depends_post = ["init:frontend"]
run = [
  "python -m ensurepip --upgrade",
  "python -m pip install --upgrade -r requirements.txt",
  "python -m pip install --upgrade -r requirements-dev.txt",
]

[tasks."init:frontend"]
description = "Install frontend dependencies"
dir = "lti_frontend"
run = "npm install"

[tasks."cdk:synth"]
description = "Synthesize CDK stack and check for security issues"
depends = "site:build"
run = "cdk synth 2>&1 | tee /dev/tty | grep -E \"(Error|Warning).*AwsSolutions\" | wc -l"
run_windows = [
  "cdk synth > synth_output.txt 2>&1",
  "findstr \"Error.*AwsSolutions\" synth_output.txt > nul && echo Found Error AwsSolutions issues || echo No Error AwsSolutions issues",
  "findstr \"Warning.*AwsSolutions\" synth_output.txt > nul && echo Found Warning AwsSolutions issues || echo No Warning AwsSolutions issues",
  "del synth_output.txt"
]

# Least privilege CloudFormation execution policies, deployed as their own stack
# with your current credentials and attached to the CDK execution role by cdk:bootstrap

[tasks."policy:validate"]
description = "Lint the deployment policy template and reject service-wide wildcard actions"
run = [
  "cfn-lint deployment-policies/deployment-policies.yaml",
  "if grep -nE '\"[a-z0-9-]+:[*]\"' deployment-policies/deployment-policies.yaml; then echo 'Service-wide wildcard actions are not allowed'; exit 1; fi",
]

[tasks."policy:deploy"]
description = "Deploy the deployment policy stack and save POLICY_ARN to mise.local.toml"
depends = "policy:validate"
run = [
  "aws cloudformation deploy --template-file deployment-policies/deployment-policies.yaml --stack-name \"$STACK_NAME-deployment-policies\" --parameter-overrides StackName=\"$STACK_NAME\" Qualifier=\"$QUALIFIER\" --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset",
  "mise set --file mise.local.toml POLICY_ARN=\"$(aws cloudformation describe-stacks --stack-name \"$STACK_NAME-deployment-policies\" --query \"Stacks[0].Outputs[?OutputKey=='PolicyArns'].OutputValue\" --output text)\"",
  "echo 'Saved POLICY_ARN to mise.local.toml. Run mise run cdk:bootstrap if the ARNs changed.'",
]

[tasks."policy:destroy"]
description = "Delete the deployment policy stack (destroy the CDK stack and bootstrap stack first)"
run = [
  "aws cloudformation delete-stack --stack-name \"$STACK_NAME-deployment-policies\"",
  "aws cloudformation wait stack-delete-complete --stack-name \"$STACK_NAME-deployment-policies\"",
  "mise unset --file mise.local.toml POLICY_ARN",
]

[tasks."cdk:deploy"]
description = "Deploy CDK stack to AWS"
depends = "site:build"
run = "cdk deploy --require-approval never"

[tasks."cdk:sync"]
description = "Watch and deploy CDK changes with hotswap"
depends = "site:build"
run = "cdk deploy --hotswap-fallback --watch"

[tasks."cdk:destroy"]
description = "Destroy CDK stack and cleanup resources"
run = "cdk destroy --force"

[tasks."site:build"]
description = "Build LTI frontend site"
dir = "{{ config_root }}/lti_frontend"
run = ["npm run build"]

[tasks."aitranslator:package"]
description = "Package AI Translator Moodle plugin"
dir = "{{cwd}}/moodle/plugin/blocks"
run = [
  "rm -f aitranslator.zip",
  "zip -r aitranslator.zip block_aitranslator",
]
run_windows = [
  "if exist aitranslator.zip del /q aitranslator.zip",
  "powershell -Command \"Compress-Archive -Path block_aitranslator -DestinationPath aitranslator.zip -Force\"",
]

[tasks."events:package"]
description = "Package AWS Events Moodle plugin"
dir = "{{cwd}}/moodle/plugin/local"
run = [
  "rm -f awsevents.zip",
  "zip -r awsevents.zip local_awsevents",
]
run_windows = [
  "if exist awsevents.zip del /q awsevents.zip",
  "powershell -Command \"Compress-Archive -Path local_awsevents -DestinationPath awsevents.zip -Force\"",
]

[tasks.package]
description = "Package all Moodle plugins"
depends = ["events:package", "aitranslator:package"]

# Security audit tasks. `mise run audit` runs them all and saves the output
# to audit-reports/ as evidence for a security review.

[tasks."audit:secrets"]
description = "Scan git-tracked files for hardcoded secrets"
run = "detect-secrets scan | python -c \"import json,sys; r=json.load(sys.stdin)['results']; print(json.dumps(r, indent=2) if r else 'No secrets found'); sys.exit(1 if r else 0)\""

[tasks."audit:deps:python"]
description = "Check Python dependencies for known vulnerabilities"
run = "pip-audit -r requirements.txt -r requirements-dev.txt -r lambda/lti/requirements.txt -r layers/requests/requirements.txt -r layers/python-pptx/requirements.txt"

[tasks."audit:deps:npm"]
description = "Check frontend dependencies for known vulnerabilities"
dir = "{{ config_root }}/lti_frontend"
run = "npm audit --audit-level=high"

[tasks."audit:sast:python"]
description = "Scan Python code for security issues"
run = "bandit -r app.py cdk lambda"

[tasks."audit:cdk-nag"]
description = "Synthesize the CDK app and fail on cdk-nag errors"
depends = "site:build"
run = "cdk synth --quiet"

[tasks."audit:shell"]
description = "Lint the shell task scripts"
run = "shellcheck mise-tasks/audit mise-tasks/clean mise-tasks/cdk/bootstrap"

[tasks."audit:licenses"]
description = "List third-party licenses for review"
# The Python list is built in a throwaway environment holding only what the
# requirements files install, so stray packages in .venv don't appear in it.
run = [
  "uv run --isolated --no-project --with-requirements requirements.txt --with-requirements requirements-dev.txt --with-requirements lambda/lti/requirements.txt --with-requirements layers/requests/requirements.txt --with-requirements layers/python-pptx/requirements.txt --with pip-licenses==5.5.5 pip-licenses --order=license --with-urls --ignore-packages pip-licenses prettytable wcwidth --output-file licenses-python.txt",
  "npx --yes license-checker@25.0.1 --start lti_frontend --csv --out licenses-ts.csv",
]
